server:
  port: 8090

spring:

  main:
    allow-bean-definition-overriding: true
  config:
    import: optional:classpath:config.yml
  ai:
    trading:
      skills:
        enabled-client-ids:
          - "6001"
      data-source:
        provider: tushare
        tushare-token: ${TUSHARE_TOKEN:}
        sina-news-enabled: true            # 新增：是否启用新浪财经新闻搜索，默认 true
        sina-news-page-size: 50            # 新增：新闻搜索最大返回条数，默认 50
        cache:
          historical-bars-ttl: 86400
          fundamental-data-ttl: 3600
          sentiment-ttl: 1800
          stock-info-ttl: 300
          news-ttl: 1800                   # 新增：新闻数据缓存 TTL，30 分钟
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:dummy-key}
    agent:
      auto-config:
        enabled: true
        client-ids: 3001,3101,3102,3103,3104,3201,4101,4102,4103,4104,5101,5102,5103,5104,6001,6002,6003,6004,6005,6006,6007,6008,6009,6010,6011,6012,6013
    alibaba:
      mem0:
        client:
          base-url: http://127.0.0.1:8889
          timeout-seconds: 5
        server:
          version: v0.1.116
          vector-store:
            provider: pgvector
            config:
              host: ${POSTGRES_HOST:localhost}
              port: ${POSTGRES_PORT:15432}
              dbname: ${POSTGRES_DB:ai-rag-knowledge}
              user: ${POSTGRES_USER:postgres}
              password: ${POSTGRES_PASSWORD:123}
              collection-name: ${POSTGRES_COLLECTION_NAME:memories}
#          graph-store:
#            provider: neo4j
#            config:
#              url: ${NEO4J_URI:bolt://localhost:7687}
#              username: ${NEO4J_USERNAME:neo4j}
#              password: ${NEO4J_PASSWORD:mem0graph}
          llm:
            provider: deepseek
            config:
              api-key: ${DEEPSEEK_API_KEY:}
              temperature: 0.2
#              ai-base-url: https://api.deepseek.com/chat/completions
              model: deepseek-chat
          embedder:
            provider: openai
            config:
              api-key: ${AI_DASHSCOPE_API_KEY:}
              model: text-embedding-v4
              openai-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          num-batch: 512
        model: nomic-embed-text
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY:dummy-key}
      embedding-model: embedding-3
      chat:
        model: glm-4.7
  datasource:
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: ${PGVECTOR_USER:postgres}
      password: ${PGVECTOR_PASSWORD:postgres}
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:15432/ai-rag-knowledge}
      type: com.zaxxer.hikari.HikariDataSource
      # hikari连接池配置
      hikari:
        #连接池名
        pool-name: HikariCP
        #最小空闲连接数
        minimum-idle: 5
        # 空闲连接存活最大时间，默认10分钟
        idle-timeout: 600000
        # 连接池最大连接数，默认是10
        maximum-pool-size: 10
        # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
        auto-commit: true
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        max-lifetime: 1800000
        # 数据库连接超时时间,默认30秒
        connection-timeout: 30000
        # 连接测试query
        connection-test-query: SELECT 1
    mysql:
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:}
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai-agent-station?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    oss:
      bucket-name: https://s3.cn-north-1.jdcloud-oss.com
      region: cn-north-1
      access-key: ${JD_CLOUD_OSS_ACCESS_KEY:}
      secret-key: ${JD_CLOUD_OSS_SECRET_KEY:}
      endpoint: denny-test
  data:
    elasticsearch:
      client:
        rest:
          uris: http://localhost:9200

# rag配置
rag:
  rerank:
    provider: rank
    config:
      base-url: https://dashscope.aliyuncs.com
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen3-rerank
      timeout-ms: 8000
  retrieval:
    pre-filter:
      enable: true
      min-similarity: 0.15
      min-keyword-overlap: 1
    post-filter:
      enable: true
      min-rerank-score: 0.2
      min-effective-docs: 1
  embedding:
    config:
      base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v3
      timeout-ms: 8000
      dimension: 768

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  type-aliases-package: denny.ai.agent.infrastructure.dao.po

# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  host: ${LANGFUSE_HOST:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  timeout-ms: 10000

# 会话记忆持久化配置
chat:
  memory:
    enabled: true
    redis-ttl-hours: 24
    max-cache-size: 20

logging:
  level:
    denny.ai.agent.domain.service.auto.step.routing.IntentRoutingService: DEBUG
    denny.ai.agent.domain.service.auto.step.routing.IntentRoutingNode: DEBUG
    denny.ai.agent.domain.service.intent.IntentFewshotService: DEBUG
#    denny:
