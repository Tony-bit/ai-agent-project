server:
  port: 8090

spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import: optional:classpath:config.yml
  ai:
    trading:
      data-source:
        provider: tushare
        tushare-token: ${TUSHARE_TOKEN:e054d234d3479bb5c6e7e1146c361d511a7cd9c8bb6de49d37b385c0}
        sina-news-enabled: true            # 新增：是否启用新浪财经新闻搜索，默认 true
        sina-news-page-size: 50            # 新增：新闻搜索最大返回条数，默认 50
        cache:
          historical-bars-ttl: 86400
          fundamental-data-ttl: 3600
          sentiment-ttl: 1800
          stock-info-ttl: 300
          news-ttl: 1800                   # 新增：新闻数据缓存 TTL，30 分钟
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:dummy-key}
    agent:
      auto-config:
        enabled: true
        client-ids: 3101,3102,3103,3104,4101,4102,4103,4104,5101,5102,5103,5104
    alibaba:
      mem0:
        client:
          base-url: http://127.0.0.1:8889
          timeout-seconds: 120
        server:
          version: v0.1.116
          vector-store:
            provider: pgvector
            config:
              host: ${POSTGRES_HOST:localhost}
              port: ${POSTGRES_PORT:15432}
              dbname: ${POSTGRES_DB:ai-rag-knowledge}
              user: ${POSTGRES_USER:postgres}
              password: ${POSTGRES_PASSWORD:123}
              collection-name: ${POSTGRES_COLLECTION_NAME:memories}
#          graph-store:
#            provider: neo4j
#            config:
#              url: ${NEO4J_URI:bolt://localhost:7687}
#              username: ${NEO4J_USERNAME:neo4j}
#              password: ${NEO4J_PASSWORD:mem0graph}
          llm:
            provider: deepseek
            config:
              api-key: ${DEEPSEEK_API_KEY:sk-a0df0f93a5ac475e8c73c6e3495cfc05}
              temperature: 0.2
#              ai-base-url: https://api.deepseek.com/chat/completions
              model: deepseek-chat
          embedder:
            provider: openai
            config:
              api-key: ${AI_DASHSCOPE_API_KEY:}
              model: text-embedding-v4
              openai-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          num-batch: 512
        model: nomic-embed-text
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: f159764707384a1ca0b0a83fbd3ed065.YooCMBFpJSN0vUoN
      embedding-model: embedding-3
      chat:
        model: glm-4-flash
  datasource:
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
      url: jdbc:postgresql://localhost:15432/ai-rag-knowledge
      type: com.zaxxer.hikari.HikariDataSource
      # hikari连接池配置
      hikari:
        #连接池名
        pool-name: HikariCP
        #最小空闲连接数
        minimum-idle: 5
        # 空闲连接存活最大时间，默认10分钟
        idle-timeout: 600000
        # 连接池最大连接数，默认是10
        maximum-pool-size: 10
        # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
        auto-commit: true
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        max-lifetime: 1800000
        # 数据库连接超时时间,默认30秒
        connection-timeout: 30000
        # 连接测试query
        connection-test-query: SELECT 1
    mysql:
      username: navicat_user
      password: Panzer1234@
      url: jdbc:mysql://111.228.9.124:3306/ai-agent-station?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    oss:
      bucket-name: https://s3.cn-north-1.jdcloud-oss.com
      region: cn-north-1
      access-key: JDC_DBA83F9D0DE38A07D239EEAE8576
      secret-key: EE9A6C0EADC7A96325349BF03C6E5A8A
      endpoint: denny-test
  data:
    elasticsearch:
      client:
        rest:
          uris: http://localhost:9200

# rag配置
rag:
  rerank:
    provider: rank
    config:
      base-url: https://dashscope.aliyuncs.com
      api-key: sk-b1050a5b1a7e41bcaddc968acdf637a6
      model: qwen3-rerank
      timeout-ms: 8000
  retrieval:
    pre-filter:
      enable: true
      min-similarity: 0.15
      min-keyword-overlap: 1
    post-filter:
      enable: true
      min-rerank-score: 0.2
      min-effective-docs: 1
  embedding:
    config:
      base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
      api-key: sk-b1050a5b1a7e41bcaddc968acdf637a6
      model: qwen3-vl-embedding
      timeout-ms: 8000
      dimension: 768

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  type-aliases-package: denny.ai.agent.infrastructure.dao.po

# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

langfuse:
  enabled: true
  host: http://1.12.53.53:3000
  public-key: pk-lf-8d9708a3-dbda-4f1c-a3ba-0ce8ed1ff511
  secret-key: sk-lf-aaae2872-e0f7-44c5-b611-4e2aea56334f
  timeout-ms: 10000

# 会话记忆持久化配置
chat:
  memory:
    enabled: true
    redis-ttl-hours: 24
    max-cache-size: 20

logging:
  level:
    web: DEBUG # 这将打印所有Controller映射的详细信息
    # 可选：同时开启Spring核心日志，看扫描过程
    org.springframework.context: DEBUG