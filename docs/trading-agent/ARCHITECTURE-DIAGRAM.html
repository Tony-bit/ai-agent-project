<!DOCTYPE html>

      <stop offset="0%" stop-color="#00e5c3" stop-opacity="0.12"/>

      <stop offset="100%" stop-color="#ffab40" stop-opacity="0.03"/>

      <stop offset="0%" stop-color="#b388ff" stop-opacity="0.12"/>
