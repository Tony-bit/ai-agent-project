# docker compose -f docker-compose-app.yml up -d
#
# 当前 compose 只部署应用容器。
# MySQL、Redis、PgVector、Mem0 已在其他容器中运行时，需要把本服务加入同一个 Docker network，
# 并在 .env 中把对应 host 写成那些容器在该 network 下可解析的名称。
services:
  ai-agent-study:
    image: system/ai-agent-study-app:1.0
    container_name: ai-agent-study
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8091
      JAVA_OPTS: ${JAVA_OPTS:-}
      PARAMS: ${PARAMS:-}
      SPRING_DATASOURCE_MYSQL_URL: ${SPRING_DATASOURCE_MYSQL_URL:-}
      SPRING_DATASOURCE_MYSQL_USERNAME: ${SPRING_DATASOURCE_MYSQL_USERNAME:-}
      SPRING_DATASOURCE_MYSQL_PASSWORD: ${SPRING_DATASOURCE_MYSQL_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-vector_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ai-rag-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_COLLECTION_NAME: ${POSTGRES_COLLECTION_NAME:-memories}
      REDIS_SDK_CONFIG_HOST: ${REDIS_SDK_CONFIG_HOST:-redis}
      REDIS_SDK_CONFIG_PORT: ${REDIS_SDK_CONFIG_PORT:-6379}
      REDIS_SDK_CONFIG_PASSWORD: ${REDIS_SDK_CONFIG_PASSWORD:-}
      SPRING_AI_ALIBABA_MEM0_CLIENT_BASE_URL: ${SPRING_AI_ALIBABA_MEM0_CLIENT_BASE_URL:-http://mem0:8889}
      SPRING_AI_ALIBABA_MEM0_CLIENT_TIMEOUT_SECONDS: ${SPRING_AI_ALIBABA_MEM0_CLIENT_TIMEOUT_SECONDS:-5}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      SPRING_AI_OPENAI_CHAT_MODEL: ${SPRING_AI_OPENAI_CHAT_MODEL:-glm-4.7}
      RAG_RERANK_CONFIG_API_KEY: ${RAG_RERANK_CONFIG_API_KEY:-}
      RAG_EMBEDDING_CONFIG_API_KEY: ${RAG_EMBEDDING_CONFIG_API_KEY:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./log:/data/log
    networks:
      - app-external-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-external-network:
    external: true
    name: ${APP_DOCKER_NETWORK:-my-network}
