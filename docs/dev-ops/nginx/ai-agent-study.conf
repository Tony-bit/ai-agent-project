# AI Agent Study - Nginx 配置
# 部署路径: /etc/nginx/sites-available/ai-agent-study.conf
# 启用: ln -sf /etc/nginx/sites-available/ai-agent-study.conf /etc/nginx/sites-enabled/

server {
    listen 8080;
    server_name _;

    # 静态前端文件
    root /home/ubuntu/ai-agent-project/docs/dev-ops/nginx/html;
    index index.html;

    # API 反向代理到 Java 后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必须关闭缓冲，否则 auto_agent / trading 会阻塞
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
