<!doctype html>
<meta charset="utf-8">
<title>Agent UI security smoke</title>
<script src="../js/marked.min.js"></script>
<script src="../js/purify.min.js"></script>
<script src="../js/agent-ui-core.js"></script>
<div id="sandbox"></div>
<pre id="result">running</pre>
<iframe id="agentUi" title="Agent UI smoke fixture"
    style="position:absolute;width:1px;height:1px;left:-10000px;border:0"></iframe>
<script>
    const resultNode = document.getElementById('result');

    function assert(condition, message) {
        if (!condition) throw new Error(message);
    }

    function waitFor(predicate, timeout = 3000) {
        const startedAt = Date.now();
        return new Promise((resolve, reject) => {
            const check = () => {
                if (predicate()) {
                    resolve();
                } else if (Date.now() - startedAt >= timeout) {
                    reject(new Error('Timed out waiting for UI state'));
                } else {
                    setTimeout(check, 20);
                }
            };
            check();
        });
    }

    function createSseResponse(targetWindow, chunks) {
        const encoder = new targetWindow.TextEncoder();
        const stream = new targetWindow.ReadableStream({
            start(controller) {
                chunks.forEach((chunk) => controller.enqueue(encoder.encode(chunk)));
                controller.close();
            }
        });
        return new targetWindow.Response(stream, {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream; charset=UTF-8' }
        });
    }

    async function runSmoke() {
        const checks = [];
        const { sanitizeMarkdown } = window.AgentUiCore;
        const sandbox = document.getElementById('sandbox');
        const dirty = [
            '<img src=x onerror="window.__xss=1">',
            '<script>window.__xss=1<\/script>',
            '<style>body{display:none}</style>',
            '[bad](javascript:window.__xss=1)',
            '<form><input autofocus onfocus="window.__xss=1"></form>'
        ].join('\n\n');
        window.__xss = 0;
        sandbox.innerHTML = sanitizeMarkdown(window.marked, window.DOMPurify, dirty);
        const forbidden = sandbox.querySelector('script,img,style,form,input,[onerror],[onfocus]');
        const dangerousHref = Array.from(sandbox.querySelectorAll('[href]'))
            .some((node) => /^javascript:/i.test(node.getAttribute('href') || ''));
        assert(window.__xss === 0 && !forbidden && !dangerousHref,
            'Unsafe Markdown survived sanitization');
        checks.push('markdown sanitization');

        window.localStorage.removeItem('agent.apiBase');
        window.localStorage.removeItem('agent.userId');
        const frame = document.getElementById('agentUi');
        const indexHtml = await fetch('../index.html').then((response) => response.text());
        const fixtureBootstrap = `<script>
            window.__fixtureRequests = [];
            window.fetch = (url, options = {}) => {
                window.__fixtureRequests.push({ url: String(url), method: options.method || 'GET' });
                return Promise.resolve(new Response(JSON.stringify({
                    code: '200', data: { sessions: [], hasMore: false }
                }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
            };
        <\/script>`;
        const baseFixtureHtml = indexHtml
            .replace('<script src="js/3.4.17.js"><\/script>', '')
            .replace(/<script>\s*tailwind\.config\s*=\s*\{[\s\S]*?<\/script>/, '')
            .replace('<head>', '<head><base href="../">')
            .replace('</head>', `${fixtureBootstrap}</head>`);

        async function loadFixture(search) {
            const fixtureHtml = baseFixtureHtml
                .replace(
                    'search: window.location.search',
                    `search: ${JSON.stringify(search || '')}`
                )
                // srcdoc documents have the opaque origin "null"; use the parent test origin.
                .replace(
                    'origin: window.location.origin',
                    `origin: ${JSON.stringify(window.location.origin)}`
                );
            const frameReady = new Promise((resolve) => {
                frame.addEventListener('load', resolve, { once: true });
            });
            frame.srcdoc = fixtureHtml;
            await frameReady;
            return { agentWindow: frame.contentWindow, agentDocument: frame.contentDocument };
        }

        let { agentWindow, agentDocument } = await loadFixture('');
        const thinking = agentDocument.getElementById('thinkingMessages');
        const result = agentDocument.getElementById('resultMessages');
        const resetPanels = () => {
            thinking.innerHTML = '';
            result.innerHTML = '';
        };

        assert(agentWindow.buildApiUrl('/api/v1/test') === '/api/v1/test'
            && agentDocument.getElementById('currentUserId').textContent === 'test-user-f52b2ed1',
            'Same-origin runtime configuration did not use the default user');
        checks.push('same-origin runtime configuration');

        resetPanels();
        const generalState = agentWindow.createStreamState('general');
        [
            { type: 'content', subType: 'answer', step: 1, content: 'Hel', completed: false },
            { type: 'content', subType: 'answer', step: 1, content: 'lo', completed: false },
            { type: 'content', subType: 'answer', step: 1, content: '', completed: true },
            { type: 'complete', content: '执行完成', completed: true },
            { type: 'complete', content: '重复完成', completed: true }
        ].forEach((event) => agentWindow.handleRawSseEvent(generalState, event));
        assert(generalState.terminalSeen && generalState.outcome === 'completed',
            'General stream did not terminate as completed');
        assert(result.querySelectorAll('.message').length === 2,
            'General stream did not render one final message and one terminal event');
        assert((result.textContent.match(/执行完成/g) || []).length === 1,
            'General stream rendered more than one terminal event');
        assert((result.textContent.match(/Hello/g) || []).length === 1,
            'General stream did not solidify content exactly once');
        checks.push('general terminal sequence');

        resetPanels();
        const tradingState = agentWindow.createStreamState('trading');
        [
            { type: 'trading', subType: 'final_decision', content: '最终决策', completed: false },
            { type: 'final', subType: 'final_completed', content: '最终输出', completed: true },
            { type: 'trading', subType: 'trading_complete', content: '交易分析完成', completed: true }
        ].forEach((event) => agentWindow.handleRawSseEvent(tradingState, event));
        assert(tradingState.terminalSeen && tradingState.outcome === 'completed',
            'Trading stream did not terminate as completed');
        assert(result.querySelectorAll('.message').length === 3 && thinking.querySelectorAll('.message').length === 0,
            'Trading result events were routed to the wrong panel');
        checks.push('trading terminal sequence');

        resetPanels();
        const tradingRoleState = agentWindow.createStreamState('trading');
        [
            { type: 'analyst', subType: 'analyst_start', content: '基本面分析开始: AAPL', completed: false },
            { type: 'analyst', subType: 'analyst_report', content: '{"trendSignal":"上涨","keyPatterns":[]}', completed: false },
            { type: 'risk_debate', subType: 'neutral_opinion', content: '中性风险观点', completed: false },
            { type: 'final', subType: 'portfolio_manager_start', content: '组合经理开始最终审批...', completed: false }
        ].forEach((event) => agentWindow.handleRawSseEvent(tradingRoleState, event));
        const roleText = `${thinking.textContent} ${result.textContent}`;
        assert(roleText.includes('基本面分析师') && roleText.includes('技术分析师')
                && roleText.includes('中立风控分析师') && roleText.includes('组合经理'),
            'Trading node roles were not rendered as Chinese labels');
        assert(!roleText.includes('未知事件') && !roleText.includes('未知阶段'),
            'Trading node role labels regressed to unknown placeholders');
        checks.push('trading role labels');

        resetPanels();
        const errorState = agentWindow.createStreamState('general');
        agentWindow.handleRawSseEvent(errorState,
            { type: 'error', content: '任务失败', completed: true });
        agentWindow.handleRawSseEvent(errorState,
            { type: 'complete', content: '不应显示', completed: true });
        assert(errorState.outcome === 'failed', 'Error stream outcome was overwritten');
        assert(thinking.querySelectorAll('.message').length === 1
            && result.querySelectorAll('.message').length === 0
            && !agentDocument.body.textContent.includes('不应显示'),
            'A success terminal event was rendered after an error');
        checks.push('error terminal sequence');

        resetPanels();
        agentWindow.__xss = 0;
        const payload = '<img src=x onerror="window.__xss=1">';
        agentWindow.addMessage(payload, 'user');
        agentWindow.renderMessagesToPanels([
            { role: 'user', content: payload },
            { role: 'assistant', content: payload, model: payload, latencyMs: payload }
        ]);
        assert(agentWindow.__xss === 0
            && !thinking.querySelector('script,img,style,form,input,[onerror],[onfocus]')
            && !result.querySelector('script,img,style,form,input,[onerror],[onfocus]')
            && agentDocument.body.textContent.includes(payload),
            'User or history content escaped the rendering boundary');
        checks.push('user and history XSS');

        resetPanels();
        const metadataState = agentWindow.createStreamState('general');
        agentWindow.handleRawSseEvent(metadataState, {
            type: 'future_event', subType: 'future_stage', step: 2, content: 'safe', completed: false
        });
        agentWindow.handleRawSseEvent(metadataState, {
            type: '<img>', subType: 'error', step: '<svg>', content: 'unsafe', completed: false
        });
        assert(metadataState.protocolErrors === 1
            && thinking.textContent.includes('Future Event')
            && thinking.textContent.includes('Future Stage')
            && !thinking.innerHTML.includes('future_event')
            && !thinking.innerHTML.includes('future_stage')
            && !thinking.querySelector('img,svg,[onerror]')
            && !result.querySelector('img,svg,[onerror]'),
            'Protocol metadata was rendered as executable markup');
        checks.push('protocol metadata XSS');

        const runFailedResponse = async (response, label) => {
            resetPanels();
            agentWindow.fetch = () => Promise.resolve(response);
            const input = agentDocument.getElementById('messageInput');
            input.value = label;
            agentWindow.sendMessage();
            await waitFor(() => !agentDocument.getElementById('sendBtn').disabled);
            assert(agentDocument.querySelectorAll('.bubble-error').length === 1,
                `${label} did not render exactly one error`);
        };

        await runFailedResponse(new agentWindow.Response('{}', {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
        }), 'json-response');
        await runFailedResponse(new agentWindow.Response(null, { status: 204 }), 'empty-response');
        checks.push('invalid responses');

        resetPanels();
        const incompleteState = agentWindow.createStreamState('general');
        agentWindow.handleRawSseEvent(incompleteState, {
            type: 'summary', content: '已收到的分析结果', completed: false
        });
        const streamEnd = agentWindow.AgentUiCore.resolveStreamEnd(incompleteState, true);
        incompleteState.outcome = streamEnd.outcome;
        agentWindow.addStageMessage(
            'warning', 'stream_interrupted', streamEnd.notice, null, 'thinking'
        );
        assert(streamEnd.outcome === 'indeterminate', 'Missing terminal must be indeterminate');
        assert(thinking.textContent.includes('状态未确认'), 'Indeterminate warning was not rendered');
        assert(!thinking.textContent.includes('操作失败'), 'Indeterminate warning was rendered as failure');
        assert(thinking.querySelectorAll('.bubble-warning').length === 1
            && thinking.querySelectorAll('.bubble-error').length === 0,
            'Indeterminate warning did not use its distinct presentation');
        checks.push('indeterminate stream warning');

        resetPanels();
        let fetchCalls = 0;
        let resolveFetch;
        agentWindow.fetch = () => {
            fetchCalls += 1;
            return new Promise((resolve) => { resolveFetch = resolve; });
        };
        const input = agentDocument.getElementById('messageInput');
        input.value = 'first';
        agentWindow.sendMessage();
        input.value = 'second';
        agentWindow.sendMessage();
        assert(fetchCalls === 1
            && Array.from(agentDocument.querySelectorAll('.fixed')).some((node) =>
                node.textContent.includes('已有任务正在处理中')),
            'Duplicate submission started a second Fetch');
        resolveFetch(createSseResponse(agentWindow, [
            'data: {"type":"complete","content":"执',
            '行完成","completed":true}\r\n\r\n'
        ]));
        await waitFor(() => !agentDocument.getElementById('sendBtn').disabled);
        assert(result.querySelectorAll('.stage-indicator').length === 1
            && (result.textContent.match(/执行完成/g) || []).length === 1,
            'Fragmented terminal response was not rendered exactly once');
        checks.push('pre-header duplicate submission');

        resetPanels();
        let generalAbortCount = 0;
        agentWindow.fetch = (url, options = {}) => new Promise((resolve, reject) => {
            options.signal.addEventListener('abort', () => {
                generalAbortCount += 1;
                reject(new agentWindow.DOMException('Aborted', 'AbortError'));
            }, { once: true });
        });
        input.value = 'cancel-general';
        agentWindow.sendMessage();
        const cancelButton = agentDocument.getElementById('cancelRequestBtn');
        assert(agentDocument.getElementById('sendBtn').disabled
            && !cancelButton.classList.contains('hidden'),
            'General request did not enter the running state');
        cancelButton.click();

        let resolveRetry;
        agentWindow.fetch = () => new Promise((resolve) => { resolveRetry = resolve; });
        input.value = 'retry-after-cancel';
        agentWindow.sendMessage();
        await new Promise((resolve) => setTimeout(resolve, 0));
        assert(agentDocument.getElementById('sendBtn').disabled,
            'Old request cleanup ended the newer request');
        resolveRetry(createSseResponse(agentWindow, [
            'data: {"type":"complete","content":"重试完成","completed":true}\n\n'
        ]));
        await waitFor(() => !agentDocument.getElementById('sendBtn').disabled);
        assert(generalAbortCount === 1 && cancelButton.classList.contains('hidden'),
            'General cancellation did not abort and restore the UI');
        checks.push('general cancel and immediate retry');

        agentWindow.switchMode('trading');
        let tradingAbortCount = 0;
        agentWindow.fetch = (url, options = {}) => new Promise((resolve, reject) => {
            options.signal.addEventListener('abort', () => {
                tradingAbortCount += 1;
                reject(new agentWindow.DOMException('Aborted', 'AbortError'));
            }, { once: true });
        });
        agentDocument.getElementById('tradingTicker').value = 'AAPL';
        agentWindow.sendTradingAnalysis();
        assert(agentDocument.getElementById('sendTradingBtn').disabled,
            'Trading request did not enter the running state');
        cancelButton.click();
        await waitFor(() => !agentDocument.getElementById('sendTradingBtn').disabled);
        assert(tradingAbortCount === 1 && cancelButton.classList.contains('hidden'),
            'Trading cancellation did not abort and restore the UI');
        checks.push('trading cancellation');

        ({ agentWindow, agentDocument } = await loadFixture(
            '?apiBase=http%3A%2F%2Flocalhost%3A8090&userId=demo-user'
        ));
        const configuredUserId = agentDocument.getElementById('currentUserId').textContent;
        const configuredTestUrl = agentWindow.buildApiUrl('/api/v1/test');
        assert(configuredUserId === 'demo-user'
            && configuredTestUrl === 'http://localhost:8090/api/v1/test',
            `Configured API host or user was not applied: ${JSON.stringify({ configuredUserId, configuredTestUrl })}`);
        checks.push('configured host and user');

        const configuredUrls = agentWindow.__fixtureRequests.map((request) => request.url);
        agentWindow.fetch = (url, options = {}) => {
            configuredUrls.push(String(url));
            if (String(url).includes('/agent/auto_agent')) {
                return Promise.resolve(createSseResponse(agentWindow, [
                    'data: {"type":"complete","content":"完成","completed":true}\n\n'
                ]));
            }
            if (String(url).includes('/trading/analysis')) {
                return Promise.resolve(createSseResponse(agentWindow, [
                    'data: {"type":"trading","subType":"trading_complete","content":"完成","completed":true}\n\n'
                ]));
            }
            const data = String(url).includes('/messages')
                ? { messages: [], hasMore: false }
                : { sessions: [], hasMore: false };
            return Promise.resolve(new agentWindow.Response(JSON.stringify({ code: '200', data }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
            }));
        };
        await agentWindow.loadSessionList(false);
        await agentWindow.loadSessionMessages('session-config', false);
        await agentWindow.syncMemory();
        agentDocument.getElementById('messageInput').value = 'configured-general';
        agentWindow.sendMessage();
        await waitFor(() => !agentDocument.getElementById('sendBtn').disabled);
        agentWindow.switchMode('trading');
        agentDocument.getElementById('tradingTicker').value = 'MSFT';
        agentWindow.sendTradingAnalysis();
        await waitFor(() => !agentDocument.getElementById('sendTradingBtn').disabled);
        assert(configuredUrls.length >= 5
            && configuredUrls.every((url) => url.startsWith('http://localhost:8090/'))
            && configuredUrls.some((url) => url.includes('/session/list?userId=demo-user'))
            && configuredUrls.some((url) => url.includes('/session/session-config/messages'))
            && configuredUrls.some((url) => url.includes('/sync-memory?userId=demo-user')),
            'All API families did not share the configured runtime');
        checks.push('shared API configuration');

        window.localStorage.removeItem('agent.userId');
        window.localStorage.removeItem('agent.apiBase');
        ({ agentWindow, agentDocument } = await loadFixture('?userId=%3Cscript%3E'));
        assert(agentDocument.getElementById('currentUserId').textContent === 'test-user-f52b2ed1',
            'Invalid userId did not fall back to the default user');
        checks.push('invalid user fallback');

        resultNode.textContent = `PASS (${checks.length}/${checks.length})\n${checks.join('\n')}`;
    }

    runSmoke().catch((error) => {
        resultNode.textContent = `FAIL\n${error.message}`;
        throw error;
    });
</script>
